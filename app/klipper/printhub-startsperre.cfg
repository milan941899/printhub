# PrintHub-Startsperre für Klipper-Drucker (z. B. Snapmaker U1 mit Paxx Extended Firmware)
#
# Wozu: Ein Druck startet nur, wenn der Druckwächter von PrintHub ihn freigibt
#       (Druckfenster, Einschalten, Licht, Plattenprüfung). Wer am Display, in Orca
#       („Hochladen und drucken“), in Fluidd/Mainsail oder in der Snapmaker-App auf
#       „Drucken“ drückt, bekommt eine Meldung – die Datei bleibt liegen, und PrintHub
#       legt sie in die Warteschlange.
#
# Einbau: Datei nach printer_data/config/extended/klipper/ kopieren (Paxx) bzw. mit
#         [include printhub-startsperre.cfg] in die printer.cfg holen, dann Klipper neu starten.
#
# Notfall: PRINTHUB_SPERRE AUS=1 schaltet die Sperre ab (bis zum nächsten Klipper-Neustart),
#          PRINTHUB_SPERRE AUS=0 schaltet sie wieder ein.

[gcode_macro PRINTHUB_FREIGABE]
description: Gibt den nächsten Druckstart frei (ruft der Druckwächter direkt vor dem Start auf)
variable_frei: 0
gcode:
  SET_GCODE_VARIABLE MACRO=PRINTHUB_FREIGABE VARIABLE=frei VALUE=1
  UPDATE_DELAYED_GCODE ID=PRINTHUB_FREIGABE_ABLAUF DURATION=60
  RESPOND MSG="PrintHub: Start freigegeben (60 s)"

[delayed_gcode PRINTHUB_FREIGABE_ABLAUF]
gcode:
  SET_GCODE_VARIABLE MACRO=PRINTHUB_FREIGABE VARIABLE=frei VALUE=0

[gcode_macro PRINTHUB_SPERRE]
description: PRINTHUB_SPERRE AUS=1 schaltet die Startsperre ab, AUS=0 wieder ein
variable_aus: 0
variable_version: 1
gcode:
  {% set aus = params.AUS|default(0)|int %}
  SET_GCODE_VARIABLE MACRO=PRINTHUB_SPERRE VARIABLE=aus VALUE={aus}
  RESPOND MSG="PrintHub: Startsperre {'AUS' if aus else 'EIN'}"

# Jeder Druckstart (Moonraker, Display, Fluidd, Warteschlange) läuft über SDCARD_PRINT_FILE
[gcode_macro SDCARD_PRINT_FILE]
rename_existing: SDCARD_PRINT_FILE_PRINTHUB
gcode:
  {% set frei = printer["gcode_macro PRINTHUB_FREIGABE"].frei|int %}
  {% set aus = printer["gcode_macro PRINTHUB_SPERRE"].aus|int %}
  {% if frei == 1 or aus == 1 %}
    SET_GCODE_VARIABLE MACRO=PRINTHUB_FREIGABE VARIABLE=frei VALUE=0
    UPDATE_DELAYED_GCODE ID=PRINTHUB_FREIGABE_ABLAUF DURATION=0
    SDCARD_PRINT_FILE_PRINTHUB {rawparams}
  {% else %}
    RESPOND TYPE=error MSG="PrintHub: Start gesperrt – der Druckwächter startet den Auftrag ({rawparams})"
  {% endif %}
