# PrintHub-Startsperre für Klipper-Drucker (z. B. Snapmaker U1 mit Paxx Extended Firmware)
#
# Wozu: Ein Druck startet nur, wenn der Druckwächter von PrintHub ihn freigibt
#       (Druckfenster, Einschalten, Licht, Plattenprüfung). Wer am Display, in Orca
#       („Hochladen und drucken“), in Fluidd/Mainsail oder in der Snapmaker-App auf
#       „Drucken“ drückt, bekommt eine Meldung – die Datei bleibt liegen, und PrintHub
#       legt sie in die Warteschlange.
#
# Einbau: Datei nach printer_data/config/extended/klipper/ kopieren (Paxx) bzw. mit
#         [include printhub-startsperre.cfg] in die printer.cfg holen, dann Klipper neu starten.
#
# Ab Version 2 zusätzlich: Parken nach Druckende. Der U1 fährt am Druckende das Bett auf Z200 und schaltet mit
#   M84 die Motoren ab – danach ist Z unbekannt. PrintHub hängt sich an dieses M84: vorher Kopf nach vorne,
#   Bett hoch in die Fotohöhe (nie näher als Teilhöhe + 20 mm), dann erst Motoren aus. So kennt PrintHub nach dem
#   Einschalten die Betthöhe und prüft die Platte ohne Z-Homing (das misst beim U1 in der Plattenmitte).
#   Die Werte setzt PrintHub selbst (_PRINTHUB_PARK). Ohne PrintHub (on=0) läuft M84 unverändert.
#
# Notfall: PRINTHUB_SPERRE AUS=1 schaltet die Sperre ab (bis zum nächsten Klipper-Neustart),
#          PRINTHUB_SPERRE AUS=0 schaltet sie wieder ein.

[gcode_macro PRINTHUB_FREIGABE]
description: Gibt den nächsten Druckstart frei (ruft der Druckwächter direkt vor dem Start auf)
variable_frei: 0
gcode:
  SET_GCODE_VARIABLE MACRO=PRINTHUB_FREIGABE VARIABLE=frei VALUE=1
  UPDATE_DELAYED_GCODE ID=PRINTHUB_FREIGABE_ABLAUF DURATION=60
  RESPOND MSG="PrintHub: Start freigegeben (60 s)"

[delayed_gcode PRINTHUB_FREIGABE_ABLAUF]
gcode:
  SET_GCODE_VARIABLE MACRO=PRINTHUB_FREIGABE VARIABLE=frei VALUE=0

[gcode_macro PRINTHUB_SPERRE]
description: PRINTHUB_SPERRE AUS=1 schaltet die Startsperre ab, AUS=0 wieder ein
variable_aus: 0
variable_version: 2
gcode:
  {% set aus = params.AUS|default(0)|int %}
  SET_GCODE_VARIABLE MACRO=PRINTHUB_SPERRE VARIABLE=aus VALUE={aus}
  RESPOND MSG="PrintHub: Startsperre {'AUS' if aus else 'EIN'}"

# Jeder Druckstart (Moonraker, Display, Fluidd, Warteschlange) läuft über SDCARD_PRINT_FILE
[gcode_macro SDCARD_PRINT_FILE]
rename_existing: SDCARD_PRINT_FILE_PRINTHUB
gcode:
  {% set frei = printer["gcode_macro PRINTHUB_FREIGABE"].frei|int %}
  {% set aus = printer["gcode_macro PRINTHUB_SPERRE"].aus|int %}
  {% if frei == 1 or aus == 1 %}
    SET_GCODE_VARIABLE MACRO=PRINTHUB_FREIGABE VARIABLE=frei VALUE=0
    UPDATE_DELAYED_GCODE ID=PRINTHUB_FREIGABE_ABLAUF DURATION=0
    SDCARD_PRINT_FILE_PRINTHUB {rawparams}
  {% else %}
    RESPOND TYPE=error MSG="PrintHub: Start gesperrt – der Druckwächter startet den Auftrag ({rawparams})"
  {% endif %}


# ---------- Parken nach Druckende (ab Version 2) ----------
[gcode_macro _PRINTHUB_PARK]
description: Werte fürs Parken nach Druckende (setzt PrintHub)
variable_on: 0
variable_x: 135.0
variable_y: 10.0
variable_z: 60.0
variable_hop: 5.0
variable_heights: []
variable_top: 0.0
variable_ende: 0
variable_geparkt: -1.0
gcode:
  RESPOND MSG="PrintHub-Parken: an={on} · Fotohöhe {z} mm · Kopf X{x} Y{y} · Referenzen {heights} · zuletzt geparkt {geparkt}"

# Druckende: Teilhöhe merken (bevor das Bett runterfährt) und kennzeichnen, dass das folgende M84 zum Druckende gehört
[gcode_macro PRINT_END]
rename_existing: PRINT_END_PRINTHUB
gcode:
  SET_GCODE_VARIABLE MACRO=_PRINTHUB_PARK VARIABLE=top VALUE={printer.gcode_move.gcode_position.z|float}
  SET_GCODE_VARIABLE MACRO=_PRINTHUB_PARK VARIABLE=geparkt VALUE=-1.0
  SET_GCODE_VARIABLE MACRO=_PRINTHUB_PARK VARIABLE=ende VALUE=1
  PRINT_END_PRINTHUB {rawparams}
  SET_GCODE_VARIABLE MACRO=_PRINTHUB_PARK VARIABLE=ende VALUE=0

# Motoren aus: nur am Druckende vorher parken – sonst unverändert
[gcode_macro M84]
rename_existing: M84.1
gcode:
  {% set p = printer["gcode_macro _PRINTHUB_PARK"] %}
  {% set homed = printer.toolhead.homed_axes %}
  {% if p.ende|int == 1 and p.on|int == 1 and "x" in homed and "y" in homed and "z" in homed %}
    {% set safe = p.top|float + 20.0 %}
    {% set hop = p.hop|float %}
    {% set ns = namespace(photo=p.z|float) %}
    {% if ns.photo - hop < safe %}
      {% set ns.photo = -1.0 %}
      {% for h in p.heights|sort %}
        {% if ns.photo < 0 and h|float - hop >= safe %}
          {% set ns.photo = h|float %}
        {% endif %}
      {% endfor %}
      {% if ns.photo < 0 %}
        {% set ns.photo = safe + hop %}
      {% endif %}
    {% endif %}
    {% set park = ns.photo - hop %}
    {% if park >= safe and park < printer.toolhead.axis_maximum.z|float %}
      G90
      G0 X{p.x} Y{p.y} F6000
      G0 Z{park} F600
      M400
      SET_GCODE_VARIABLE MACRO=_PRINTHUB_PARK VARIABLE=geparkt VALUE={park}
      RESPOND MSG="PrintHub: Bett für die Plattenprüfung auf {park} mm geparkt (Teil {p.top} mm, Foto {ns.photo} mm)"
    {% endif %}
  {% endif %}
  M84.1 {rawparams}
